<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Backend API - Special Remedies</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #00ff00;
            background: #0a0a0a;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover { background: #00cc00; }
        pre {
            background: #000;
            padding: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .error { color: #ff0000; }
        .success { color: #00ff00; }
        .warning { color: #ffaa00; }
        h2 { color: #00aaff; }
    </style>
</head>
<body>
    <h1>🧪 Backend API Test - Special Remedies</h1>

    <div class="section">
        <h2>Configuration</h2>
        <label>Backend URL:</label>
        <input type="text" id="backendUrl" value="https://zhssmkkxcnw52j5774t2dg4hlm0llzyg.lambda-url.ap-southeast-2.on.aws" style="width: 500px; padding: 5px;">
        <br><br>
        <label>Test DOB:</label>
        <input type="text" id="testDob" value="1987-04-22" style="padding: 5px;">
        <span style="color: #888;">(Should trigger 3 remedies)</span>
    </div>

    <div class="section">
        <h2>Step 1: Test /calculate/numerology Endpoint</h2>
        <button onclick="testCalculateEndpoint()">Test Calculate Endpoint</button>
        <pre id="calculateResult">Click button to test...</pre>
    </div>

    <div class="section">
        <h2>Step 2: Test /api/data/enrichment Endpoint</h2>
        <p class="warning">This requires kundliGrid from Step 1</p>
        <button onclick="testEnrichmentEndpoint()">Test Enrichment Endpoint</button>
        <pre id="enrichmentResult">Run Step 1 first...</pre>
    </div>

    <div class="section">
        <h2>Step 3: Summary</h2>
        <pre id="summary">Run tests above...</pre>
    </div>

    <script>
        let calculationData = null;

        async function testCalculateEndpoint() {
            const resultDiv = document.getElementById('calculateResult');
            const backendUrl = document.getElementById('backendUrl').value;
            const dob = document.getElementById('testDob').value;

            resultDiv.textContent = '⏳ Testing /calculate/numerology endpoint...\n';

            try {
                const response = await fetch(`${backendUrl}/calculate/numerology`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dob })
                });

                const data = await response.json();
                calculationData = data;

                resultDiv.textContent = `✅ Status: ${response.status}\n\n`;
                resultDiv.textContent += `📋 Response:\n${JSON.stringify(data, null, 2)}\n\n`;

                if (data.success && data.data) {
                    const { basicNumber, destinyNumber, kundliGrid, specialRemedies } = data.data;

                    resultDiv.textContent += `\n🔍 Key Fields:\n`;
                    resultDiv.textContent += `   Basic Number: ${basicNumber}\n`;
                    resultDiv.textContent += `   Destiny Number: ${destinyNumber}\n`;
                    resultDiv.textContent += `   Kundli Grid: ${JSON.stringify(kundliGrid)}\n`;
                    resultDiv.textContent += `   Special Remedies: ${specialRemedies ? `Array(${specialRemedies.length})` : 'undefined'}\n\n`;

                    if (specialRemedies && specialRemedies.length > 0) {
                        resultDiv.textContent += `\n✅ SPECIAL REMEDIES FOUND (${specialRemedies.length}):\n`;
                        specialRemedies.forEach((remedy, i) => {
                            resultDiv.textContent += `\n${i + 1}. ${remedy.title?.en || 'No title'}\n`;
                            resultDiv.textContent += `   Type: ${remedy.type}\n`;
                        });
                    } else {
                        resultDiv.textContent += `\n❌ NO SPECIAL REMEDIES IN RESPONSE!\n`;
                        resultDiv.textContent += `   Expected: 3 remedies for DOB 22-04-1987\n`;
                    }
                } else {
                    resultDiv.textContent += `\n❌ ERROR: ${data.message || 'Unknown error'}\n`;
                }
            } catch (error) {
                resultDiv.textContent = `❌ ERROR: ${error.message}\n\n${error.stack}`;
            }
        }

        async function testEnrichmentEndpoint() {
            const resultDiv = document.getElementById('enrichmentResult');
            const backendUrl = document.getElementById('backendUrl').value;

            if (!calculationData || !calculationData.data) {
                resultDiv.textContent = '❌ Run Step 1 first to get kundliGrid!';
                return;
            }

            const { basicNumber, destinyNumber, kundliGrid } = calculationData.data;

            resultDiv.textContent = '⏳ Testing /api/data/enrichment endpoint...\n';
            resultDiv.textContent += `📤 Sending: basicNumber=${basicNumber}, destinyNumber=${destinyNumber}\n\n`;

            try {
                const response = await fetch(`${backendUrl}/api/data/enrichment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        basicNumber,
                        destinyNumber,
                        yogaIds: [],
                        kundliGrid,
                        recurringNumbers: []
                    })
                });

                const data = await response.json();

                resultDiv.textContent += `✅ Status: ${response.status}\n\n`;
                resultDiv.textContent += `📋 Response:\n${JSON.stringify(data, null, 2)}\n\n`;

                if (data.success && data.data) {
                    const { specialRemedies, remedies } = data.data;

                    resultDiv.textContent += `\n🔍 Key Fields:\n`;
                    resultDiv.textContent += `   General Remedies: ${remedies ? 'present' : 'undefined'}\n`;
                    resultDiv.textContent += `   Special Remedies: ${specialRemedies ? `Array(${specialRemedies.length})` : 'undefined'}\n\n`;

                    if (specialRemedies && specialRemedies.length > 0) {
                        resultDiv.textContent += `\n✅ SPECIAL REMEDIES FOUND (${specialRemedies.length}):\n`;
                        specialRemedies.forEach((remedy, i) => {
                            resultDiv.textContent += `\n${i + 1}. ${remedy.title?.en || 'No title'}\n`;
                            resultDiv.textContent += `   Type: ${remedy.type}\n`;
                        });

                        // Update summary
                        document.getElementById('summary').textContent =
                            `✅ SUCCESS! Backend is returning ${specialRemedies.length} special remedies!\n\n` +
                            `If your app still shows "No special remedies required":\n` +
                            `1. Hard refresh browser (Ctrl+Shift+R)\n` +
                            `2. Clear browser cache completely\n` +
                            `3. Try incognito/private browsing window\n` +
                            `4. Check browser console for errors`;
                    } else {
                        resultDiv.textContent += `\n❌ NO SPECIAL REMEDIES IN ENRICHMENT RESPONSE!\n`;
                        resultDiv.textContent += `   This means data-service.ts fix didn't deploy correctly.\n`;

                        document.getElementById('summary').textContent =
                            `❌ PROBLEM: Enrichment endpoint not returning specialRemedies\n\n` +
                            `The Lambda needs to be re-uploaded with the latest build!`;
                    }
                } else {
                    resultDiv.textContent += `\n❌ ERROR: ${data.message || 'Unknown error'}\n`;
                }
            } catch (error) {
                resultDiv.textContent = `❌ ERROR: ${error.message}\n\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
